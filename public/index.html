<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>1xc.moe</title>
  <meta name="description" content="一小撮软乎乎的萌物住在这里 ——「1」「x」「c」三只果冻小家伙。" />
  <meta name="theme-color" content="#fff3f8" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <canvas id="stage" aria-label="三只叫做 1、x、c 的果冻小家伙，可以点它们、摸它们"></canvas>
  <div id="bubbles" aria-hidden="true"></div>

  <div id="loader" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="top">
    <div class="meter" title="你一共给了它们多少萌度">
      <span class="meter-heart">♥</span>
      <span class="meter-label">萌度</span>
      <b id="moeCount">0</b>
    </div>
    <button id="sound" class="round" aria-label="声音开关" aria-pressed="true">
      <svg class="on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4Z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4Z" fill="currentColor"/><path d="m16 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main class="hero">
    <h1 class="logo" aria-label="1xc.moe">
      <span data-poke="1" style="--i:0;--col:var(--one);--shade:var(--one-d)">1</span><span data-poke="x" style="--i:1;--col:var(--x);--shade:var(--x-d)">x</span><span data-poke="c" style="--i:2;--col:var(--c);--shade:var(--c-d)">c</span><span data-rain style="--i:3;--col:var(--moe);--shade:var(--moe-d)" class="dot">.</span><span data-rain style="--i:4;--col:var(--moe);--shade:var(--moe-d)">m</span><span data-rain style="--i:5;--col:var(--moe);--shade:var(--moe-d)">o</span><span data-rain style="--i:6;--col:var(--moe);--shade:var(--moe-d)">e</span>
    </h1>
    <p class="tagline">一小撮软乎乎的萌物，住在这里 <span class="kao">ฅ^•ﻌ•^ฅ</span></p>
    <p class="hint">
      <span class="chip">点一点</span>
      <span class="chip">摸摸头</span>
      <span class="chip kb">键盘敲 <kbd>1</kbd><kbd>x</kbd><kbd>c</kbd></span>
    </p>
  </main>

  <noscript><p class="noscript">需要开启 JavaScript 才能见到它们哦 (´・ω・`)</p></noscript>
  <script type="module" src="main.js"></script>
</body>
</html>
